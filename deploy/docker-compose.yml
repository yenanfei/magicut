# Local / staging stack. GPU real-mode is typically bare-metal + setup_ubuntu.sh
# (PyTorch CUDA + SAM2 weights), then only Caddy in front.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: magicut-api:prototype
    ports:
      - "8080:8080"
    environment:
      MAGICUT_PIPELINE_MODE: mock
      MAGICUT_API_TOKEN: ${MAGICUT_API_TOKEN:-}
      MAGICUT_JOB_TTL_HOURS: "24"
    volumes:
      - magicut_data:/app/server_data
    restart: unless-stopped

  # Optional TLS terminator for a public hostname.
  # Set MAGICUT_PUBLIC_HOST and uncomment.
  # caddy:
  #   image: caddy:2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #   depends_on:
  #     - api

volumes:
  magicut_data:
  # caddy_data:
