# Dance Person Remover Configuration

system:
  device: "cuda" # "cuda" or "cpu"
  mixed_precision: true # Use fp16 for faster inference & less VRAM

sam2:
  model_type: "sam2_hiera_l" # sam2_hiera_t, sam2_hiera_s, sam2_hiera_b+, sam2_hiera_l
  checkpoint_path: "weights/sam2_hiera_large.pt"
  model_cfg: "sam2_hiera_l.yaml"

detector:
  model_name: "yolo11x-seg.pt" # Upgraded to SOTA YOLOv11x for crisp limb & contour segmentation
  conf_threshold: 0.30
  iou_threshold: 0.5
  classes: [0] # 0 = person in COCO dataset

mask_processor:
  # General dilation around other members to eliminate ghost edges
  general_dilation_kernel: 7
  # Directional dilation downwards (Y-axis) to capture stage floor shadows
  shadow_dilation_y: 25
  shadow_dilation_x: 9
  # Edge feathering blur kernel size (must be odd)
  feather_kernel: 5
  # IoU overlap threshold to detect severe occlusion
  occlusion_iou_thresh: 0.15

inpainter:
  engine: "clean_plate" # "clean_plate" (SOTA Master Clean Plate), "diffueraser", "propainter"
  diffueraser_weights: "weights/diffuEraser"
  sd_base_weights: "weights/stable-diffusion-v1-5"
  sd_vae_weights: "weights/sd-vae-ft-mse"
  pcm_weights: "weights/PCM_Weights"
  propainter_weights: "weights/propainter"
  pcm_steps: "2-Step" # "2-Step" (ultra-fast) or "4-Step" (high-quality)
  subvideo_length: 50
  neighbor_stride: 10
  mask_dilation: 6

output:
  output_fps: null # null means keep original video fps
  save_intermediate_masks: true
  codec: "libx264"
