name: MagiCut
options:
  bundleIdPrefix: com.magicut
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: MagiCut/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.magicut.app
    DEVELOPMENT_TEAM: "" # set in Xcode
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: false
targets:
  MagiCut:
    type: application
    platform: iOS
    sources:
      - MagiCut
    settings:
      base:
        PRODUCT_NAME: MagiCut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
